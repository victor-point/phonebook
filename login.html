<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – Phonebook</title>
    <meta name="description" content="Login halaman phonebook Grandstream UCM6308A">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#07111f;--surf:rgba(13,26,52,.92);--surf2:rgba(20,38,72,.6);--bdr:rgba(80,130,255,.14);--bdrb:rgba(80,130,255,.35);--txt:#dde8ff;--mut:#6d85b8;--pri:#3d7eff;--prih:#2563eb;--dan:#f43f5e;--ok:#10b981}
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:flex;align-items:center;justify-content:center;background-image:radial-gradient(ellipse at 20% 20%,rgba(61,126,255,.2) 0%,transparent 50%),radial-gradient(ellipse at 80% 80%,rgba(139,92,246,.15) 0%,transparent 50%)}
        .login-wrap{width:100%;max-width:420px;padding:1.5rem}
        .login-card{background:var(--surf);border:1px solid var(--bdrb);border-radius:20px;padding:2.5rem 2rem;backdrop-filter:blur(16px);box-shadow:0 24px 64px rgba(0,0,0,.45),0 0 80px rgba(61,126,255,.08);animation:slideUp .5s ease}
        @keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
        .logo{display:flex;align-items:center;justify-content:center;gap:.85rem;margin-bottom:1.8rem}
        .logo-ico{width:48px;height:48px;background:linear-gradient(135deg,#3d7eff,#7c3aed);border-radius:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(61,126,255,.35)}
        .logo-ico svg{width:24px;height:24px}
        .logo-text h1{font-size:1.2rem;font-weight:700;background:linear-gradient(135deg,#60a5fa,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .logo-text p{font-size:.72rem;color:var(--mut);margin-top:2px}
        .subtitle{text-align:center;color:var(--mut);font-size:.88rem;margin-bottom:1.8rem}
        .fg{margin-bottom:1.15rem;position:relative}
        .fg label{display:block;font-size:.72rem;color:var(--mut);margin-bottom:.4rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
        .fg .ico{position:absolute;left:.85rem;bottom:.75rem;color:var(--mut);pointer-events:none}
        .fg input{width:100%;padding:.75rem .85rem .75rem 2.6rem;background:rgba(0,0,0,.35);border:1px solid var(--bdr);border-radius:10px;color:var(--txt);font-size:.95rem;font-family:'Inter',sans-serif;transition:border-color .2s,box-shadow .2s}
        .fg input:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(61,126,255,.15)}
        .fg input::placeholder{color:rgba(109,133,184,.5)}
        .btn-login{width:100%;padding:.85rem;border:none;border-radius:10px;background:linear-gradient(135deg,#3d7eff,#6366f1);color:#fff;font-family:'Inter',sans-serif;font-size:.95rem;font-weight:600;cursor:pointer;transition:all .25s;letter-spacing:.02em;margin-top:.5rem}
        .btn-login:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(61,126,255,.35)}
        .btn-login:active{transform:translateY(0)}
        .btn-login:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
        .error{text-align:center;color:var(--dan);font-size:.84rem;margin-top:1rem;min-height:1.2em;opacity:0;transition:opacity .2s}
        .error.show{opacity:1}
        .footer{text-align:center;margin-top:1.5rem;color:var(--mut);font-size:.72rem}
        .footer a{color:#60a5fa;text-decoration:none}
        .footer a:hover{text-decoration:underline}
        .shake{animation:shake .4s ease}
        @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
    </style>
</head>
<body>
<div class="login-wrap">
    <div class="login-card" id="card">
        <div class="logo">
            <div class="logo-ico">
                <svg fill="none" stroke="white" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
            </div>
            <div class="logo-text">
                <h1>Phonebook</h1>
                <p>UCM6308A &amp; GRP2616</p>
            </div>
        </div>
        <p class="subtitle">Masuk untuk mengelola phonebook</p>
        <form id="loginForm" autocomplete="off">
            <div class="fg">
                <label for="username">Username</label>
                <div class="ico"><svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg></div>
                <input type="text" id="username" placeholder="Masukkan username" required autofocus>
            </div>
            <div class="fg">
                <label for="password">Password</label>
                <div class="ico"><svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg></div>
                <input type="password" id="password" placeholder="Masukkan password" required>
            </div>
            <button type="submit" class="btn-login" id="btnLogin">Masuk</button>
            <div class="error" id="errorMsg"></div>
        </form>
        <div class="footer">
            <a href="/">← Kembali ke Directory View</a>
        </div>
    </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btnLogin');
    const errEl = document.getElementById('errorMsg');
    const card = document.getElementById('card');
    
    btn.disabled = true;
    btn.textContent = 'Memproses…';
    errEl.classList.remove('show');
    
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    
    try {
        const r = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ username, password })
        });
        const data = await r.json();
        if (data.success) {
            btn.textContent = 'Berhasil! Mengalihkan…';
            btn.style.background = 'linear-gradient(135deg, #10b981, #059669)';
            setTimeout(() => { window.location.href = '/admin'; }, 500);
        } else {
            errEl.textContent = data.message || 'Login gagal';
            errEl.classList.add('show');
            card.classList.remove('shake');
            void card.offsetWidth;
            card.classList.add('shake');
            btn.disabled = false;
            btn.textContent = 'Masuk';
        }
    } catch (err) {
        errEl.textContent = 'Gagal terhubung ke server';
        errEl.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Masuk';
    }
});

// Enter key on password field
document.getElementById('password').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('loginForm').requestSubmit();
});
</script>
</body>
</html>
